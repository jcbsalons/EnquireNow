<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JCB Privé | By Invitation Only</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; color:#fff; text-align:center; font-family:Montserrat,sans-serif; }
  main { max-width:430px; margin:auto; padding:32px 20px 40px; }
  .logo { width:130px; filter:grayscale(1) invert(1); mix-blend-mode:screen; }
  .poster { display:block; width:100%; margin-top:24px; }
  .line { width:60px; height:1px; background:#c6a15b; margin:28px auto 18px; }
  h1 { font:500 25px 'Cormorant Garamond',serif; color:#d8b878; letter-spacing:1px; }
  .sub { font-size:10px; font-weight:300; letter-spacing:3px; margin:10px 0 26px; color:#bbb; }
  .btn { display:block; padding:17px 10px; margin-bottom:14px; border:1px solid #c6a15b; text-decoration:none; text-transform:uppercase; font-size:12px; letter-spacing:3px; }
  .gold { background:linear-gradient(135deg,#a98443,#ead29a,#a98443); color:#000; }
  .outline { color:#d8b878; }
  .foot { margin-top:22px; font-size:9px; letter-spacing:3px; color:#777; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png.png" alt="Jean-Claude Biguine Salon & Spa">
  <img class="poster" src="photo.jpg.jpg" alt="JCB Privé invitation: Javed Khan at JCB Wakad">
  <div class="line"></div>
  <h1>Reserve Your Private Appointment</h1>
  <p class="sub">LIMITED APPOINTMENTS AVAILABLE</p>
  <a class="btn gold" href="tel:+919137156758">Call to Reserve</a>
  <a class="btn outline" href="tel:+919082840084">Alternate Line</a>
  <p class="foot">JCB WAKAD</p>
</main>
</body>
</html>
